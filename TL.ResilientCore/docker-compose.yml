services:
  tl-postgres:
    image: postgres:16-alpine
    container_name: tl_resilient_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TLResilientDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  tl-redis:
    image: redis:7-alpine
    container_name: tl_resilient_cache
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: